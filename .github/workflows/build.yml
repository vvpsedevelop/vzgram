name: Build VzGram APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install specific NDK
        run: |
          sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Grant execute permission for scripts
        run: |
          chmod +x gradlew
          chmod +x TMessagesProj/jni/*.sh

      - name: Patch native libs
        working-directory: TMessagesProj/jni
        run: |
          ./patch_ffmpeg.sh
          ./patch_boringssl.sh

      - name: Build FFmpeg
        working-directory: TMessagesProj/jni
        run: ./build_ffmpeg_clang.sh

      - name: Build libvpx
        working-directory: TMessagesProj/jni
        run: ./build_libvpx_clang.sh

      - name: Build BoringSSL
        working-directory: TMessagesProj/jni
        run: ./build_boringssl.sh

      - name: Build debug APK
        run: ./gradlew assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vzgram-apk
          path: '**/*.apk'
